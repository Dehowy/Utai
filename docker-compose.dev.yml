version: "3.8"

services:
  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./app/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "8765:8765"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 8765"
    environment:
      - VITE_API_URL=
      - VITE_API_TARGET=http://host.docker.internal:8765
      - VITE_WS_TARGET=ws://host.docker.internal:8765

  frontend-build:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./app/frontend:/app
      - ./app/backend/static:/output
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run build && cp -r dist/* /output/"
    profiles:
      - build

volumes:
  frontend_node_modules:
