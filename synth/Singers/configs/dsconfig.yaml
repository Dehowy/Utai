acoustic: ../files/acoustic.onnx
phonemes: ../files/phonemes.json
languages: ../files/languages.json
vocoder: dsvocoder

hidden_size: 384
max_depth: 0.6
sample_rate: 44100
hop_size: 512
win_size: 2048
fft_size: 2048
num_mel_bins: 128
mel_fmin: 40
mel_fmax: 16000
mel_base: e
mel_scale: slaney
fmin: 40
fmax: 21000

augmentation_args:
  random_pitch_shifting:
    range:
    - -5.0
    - 5.0

use_lang_id: true
use_key_shift_embed: true
use_speed_embed: true
use_energy_embed: false
use_breathiness_embed: false
use_voicing_embed: false
use_tension_embed: true
use_continuous_acceleration: true
use_variable_depth: true

speakers:
- embeds/standard
- embeds/heavy
- embeds/open
- embeds/gentle
- embeds/whisper

num_lang: 14
dictionaries:
  ar: ../../files/dictionary-ar.txt
  de: ../../files/dictionary-de.txt
  en: ../../files/dictionary-en.txt
  es: ../../files/dictionary-es.txt
  fr: ../../files/dictionary-fr.txt
  it: ../../files/dictionary-it.txt
  ja: ../../files/dictionary-ja.txt
  ko: ../../files/dictionary-ko.txt
  pl: ../../files/dictionary-pl.txt
  pt: ../../files/dictionary-pt.txt
  ru: ../../files/dictionary-ru.txt
  th: ../../files/dictionary-th.txt
  uk: ../../files/dictionary-uk.txt
  zh: ../../files/dictionary-zh.txt
