# Score2HuBERT — Phase 5: Discrete HuBERT Token Classification
#
# Goal: eliminate L1 averaging ("大舌头") by predicting discrete K-means tokens
# instead of continuous 768-dim features. Cross-entropy has no averaging.
#
# Init from Phase 3 best.pt. DiscreteHubertHead conv blocks warm-started from
# det_head weights (same architecture). logit_proj is random init.
#
# Launch:
#   venv/Scripts/python.exe scripts/train.py \
#     --config configs/finetune_discrete.yaml \
#     --init-from checkpoints/finetune_multi_det_tech/best.pt

model:
  mode: discrete

  encoder:
    d_model: 512
    n_layers: 4
    n_heads: 8
    d_ff: 2048
    conv_kernel_size: 31
    dropout: 0.1
    phoneme_vocab_size: 80
    max_pitch: 128
    pitch_embed_dim: 256
    use_relative_pos: true
    n_techniques: 6

  flow_matching:
    d_hubert: 768
    n_layers: 4
    n_heads: 8
    d_ff: 2048
    d_cond: 512
    dropout: 0.1
    sigma_min: 1.0e-4
    ot_ode: true
    cfg:
      enabled: false
      drop_prob: 0.0
      guidance_scale: 1.0

  det_head:
    d_hidden: 512
    n_blocks: 4
    kernel_size: 7
    dropout: 0.1

  discrete_head:
    d_hidden: 512               # Match det_head for weight reuse
    n_blocks: 4
    kernel_size: 7
    dropout: 0.1
    n_codes: 4096
    codebook_path: "data/processed/multi_lang_4/kmeans_4096.pt"
    init_from_det_head: true    # Copy conv blocks from det_head on first load

  f0_predictor:
    hidden_dim: 384
    conv_layers: 5
    conv_kernel: 5
    lstm_layers: 2
    dropout: 0.1

  variance:
    energy:
      enabled: true
      n_layers: 3
      kernel_size: 3
      hidden_dim: 256
    breathiness:
      enabled: true
      n_layers: 3
      kernel_size: 3
      hidden_dim: 256
    voicing:
      enabled: true
      n_layers: 2
      kernel_size: 3
      hidden_dim: 256

  duration_predictor:
    enabled: false

audio:
  sample_rate: 16000
  hop_length: 160
  win_length: 400
  n_fft: 512
  target_sr: 44100

hubert:
  layer: 12
  feature_dim: 768

f0:
  method: "rmvpe"
  f0_min: 50.0
  f0_max: 1100.0

rvc_compensation:
  enabled: false

data:
  processed_dir: "data/processed/multi_lang_4"
  val_ratio: 0.05
  test_ratio: 0.05
  max_frames: 1200
  min_frames: 30
  augmentation:
    pitch_shift:
      enabled: true
      range_semitones: [-8, 8]
      prob: 0.5
    time_stretch:
      enabled: true
      range: [0.93, 1.07]
      prob: 0.25
    noise:
      enabled: false

training:
  optimizer:
    type: "adamw"
    lr: 1.0e-4
    betas: [0.9, 0.98]
    weight_decay: 0.01
    eps: 1.0e-8
  scheduler:
    type: "warmup_cosine"
    warmup_steps: 500
    min_lr: 1.0e-6
    total_steps: 15000
  batch_size: 48
  accumulate_grad: 1
  language_balance:
    enabled: true               # Oversample ja/en so each language gets ~33% of batches
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
  max_steps: 15000
  val_every: 500
  save_every: 2000
  log_every: 50
  loss:
    discrete: 1.0
    det: 0.0
    flow_matching: 0.0
    f0: 0.0                     # f0_predictor frozen
    duration: 0.0
    energy: 0.0
    breathiness: 0.0
    voicing: 0.0
    reconstruction: 0.0
    multiscale_hubert:
      enabled: false
      scales: [1, 5, 10]
      weight: 0.3
  grad_clip: 1.0
  ema:
    enabled: false
    decay: 0.9999
  fp16: true
  save_top_k: 3
  monitor: "val/recon_l1"

inference:
  flow_steps: 1
  solver: "euler"
  cfg_scale: 1.0
  temperature: 1.0

paths:
  project_root: "."
  rvc_root: "RVC/RVC20240604Nvidia"
  hubert_model: "RVC/RVC20240604Nvidia/assets/hubert/hubert_base.pt"
  rmvpe_model: "RVC/RVC20240604Nvidia/assets/rmvpe/rmvpe.pt"
  rvc_weights_dir: "RVC/RVC20240604Nvidia/assets/weights"
  checkpoint_dir: "checkpoints/finetune_discrete"
  log_dir: "logs/finetune_discrete"
