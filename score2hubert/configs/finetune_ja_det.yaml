# Score2HuBERT — Phase 2: Japanese Fine-tuning (deterministic mode)
#
# Init from Plan C best.pt (Chinese pre-training, det mode).
# IPA shared vocabulary means encoder transfers naturally — Japanese /a/ uses
# the same token ID as Chinese /a/. No remapping needed.
#
# All Plan C lessons applied:
#   - mode: deterministic (det_head replaces flow_decoder)
#   - EMA disabled (warm-start + already-learned head, the EMA pitfall doesn't
#     apply here as strongly because det_head is no longer fresh, but staying
#     consistent with Plan C avoids any risk)
#   - 4-layer encoder (matches Plan C, NOT the old 6-layer flow config)
#   - phoneme_vocab 80 IPA tokens (NOT the old 512)
#
# Launch:
#   python scripts/train.py \
#     --config configs/finetune_ja_det.yaml \
#     --init-from checkpoints/pretrain_opencpop_det/best.pt

model:
  mode: deterministic       # Plan C — det head, bypass flow_decoder

  encoder:
    d_model: 512
    n_layers: 4              # MUST match Plan C
    n_heads: 8
    d_ff: 2048
    conv_kernel_size: 31
    dropout: 0.1
    phoneme_vocab_size: 80   # MUST match Plan C (IPA, NOT 512)
    max_pitch: 128
    pitch_embed_dim: 256
    use_relative_pos: true

  flow_matching:
    # Kept frozen, not used. Same shape as Plan C for state_dict compat.
    d_hubert: 768
    n_layers: 4
    n_heads: 8
    d_ff: 2048
    d_cond: 512
    dropout: 0.1
    sigma_min: 1.0e-4
    ot_ode: true
    cfg:
      enabled: false
      drop_prob: 0.0
      guidance_scale: 1.0

  det_head:
    d_hidden: 512            # MUST match Plan C
    n_blocks: 4              # MUST match Plan C
    kernel_size: 7
    dropout: 0.1

  f0_predictor:
    hidden_dim: 384
    conv_layers: 5
    conv_kernel: 5
    lstm_layers: 2
    dropout: 0.1

  variance:
    energy:
      enabled: true
      n_layers: 3
      kernel_size: 3
      hidden_dim: 256
    breathiness:
      enabled: true          # NEW for fine-tune — adds expression control
      n_layers: 3
      kernel_size: 3
      hidden_dim: 256
    voicing:
      enabled: true
      n_layers: 2
      kernel_size: 3
      hidden_dim: 256

  duration_predictor:
    enabled: false

audio:
  sample_rate: 16000
  hop_length: 160
  win_length: 400
  n_fft: 512
  target_sr: 44100

hubert:
  layer: 12
  feature_dim: 768

f0:
  method: "rmvpe"
  f0_min: 50.0
  f0_max: 1100.0

rvc_compensation:
  enabled: false             # leave off for first Phase 2 run; can enable in iter 2

data:
  # User chooses ONE of:
  #   data/processed/gtsinger_ja           — fastest path, GTSinger Japanese only
  #   data/processed/ja_merged             — all Japanese: kiritan + ofuton + gtsinger_ja merged
  #   data/processed/multi_lang            — Chinese + Japanese (preserves Chinese capability)
  # Set this to whichever you preprocessed.
  processed_dir: "data/processed/gtsinger_ja"
  val_ratio: 0.05
  test_ratio: 0.05
  max_frames: 1200
  min_frames: 30
  augmentation:
    pitch_shift:
      enabled: true
      range_semitones: [-8, 8]      # narrower than Plan C's [-12,12] for fine-tune
      prob: 0.5
    time_stretch:
      enabled: true
      range: [0.93, 1.07]           # narrower than Plan C's [0.9,1.1]
      prob: 0.25
    noise:
      enabled: false

training:
  optimizer:
    type: "adamw"
    lr: 7.0e-5                # ~0.5x Plan C's 1.5e-4 — gentle fine-tune of warm model
    betas: [0.9, 0.98]
    weight_decay: 0.01
    eps: 1.0e-8
  scheduler:
    type: "warmup_cosine"
    warmup_steps: 500         # short warmup — both encoder and det_head are warm
    min_lr: 1.0e-6
    total_steps: 15000        # less data than Phase 1 — fewer steps appropriate
  batch_size: 32              # same as Plan C, profiled safe
  accumulate_grad: 1
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 4
  max_steps: 15000
  val_every: 500              # smaller dataset → more frequent val
  save_every: 1500
  log_every: 50
  loss:
    det: 1.0                  # Plan C deterministic head loss
    flow_matching: 0.0        # disabled, flow_decoder frozen
    f0: 1.0
    duration: 0.0
    energy: 0.1
    breathiness: 0.05         # enabled (was 0 in Plan C pre-training)
    voicing: 0.05
    reconstruction: 0.0       # disabled, det_head replaces it
    multiscale_hubert:
      enabled: false
      scales: [1, 5, 10]
      weight: 0.3
  grad_clip: 1.0
  ema:
    enabled: false            # SAME LESSON FROM PLAN C — see project_score2hubert_ema_pitfall
                              # Even though det_head is no longer fresh in Phase 2 (init from
                              # Plan C best.pt), we stay consistent. The EMA blend pathology
                              # is less likely here but disabling removes any risk.
    decay: 0.9999
  fp16: true
  save_top_k: 3
  monitor: "val/recon_l1"     # det_l1 logged under recon_l1 name (see Plan C trainer changes)

inference:
  flow_steps: 1               # not used in det mode
  solver: "euler"
  cfg_scale: 1.0
  temperature: 1.0

paths:
  project_root: "."
  rvc_root: "RVC/RVC20240604Nvidia"
  hubert_model: "RVC/RVC20240604Nvidia/assets/hubert/hubert_base.pt"
  rmvpe_model: "RVC/RVC20240604Nvidia/assets/rmvpe/rmvpe.pt"
  rvc_weights_dir: "RVC/RVC20240604Nvidia/assets/weights"
  checkpoint_dir: "checkpoints/finetune_ja_det"
  log_dir: "logs/finetune_ja_det"
