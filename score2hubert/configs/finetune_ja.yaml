# Score2HuBERT — Phase 2: Japanese Fine-tuning
# Expected: ~2-3 hours on RTX 3080 Ti
# Resume from: checkpoints/pretrain_opencpop/best.pt

model:
  encoder:
    d_model: 512
    n_layers: 6
    n_heads: 8
    d_ff: 2048
    conv_kernel_size: 31
    dropout: 0.1
    phoneme_vocab_size: 512
    max_pitch: 128
    pitch_embed_dim: 256
    use_relative_pos: true

  flow_matching:
    d_hubert: 768
    n_layers: 6
    n_heads: 8
    d_ff: 2048
    d_cond: 512
    dropout: 0.1
    sigma_min: 1.0e-4
    ot_ode: true
    cfg:
      enabled: true
      drop_prob: 0.10  # less dropping for fine-tuning
      guidance_scale: 2.5

  f0_predictor:
    hidden_dim: 384
    conv_layers: 5
    conv_kernel: 5
    lstm_layers: 2
    dropout: 0.1

  variance:
    energy:
      enabled: true
      n_layers: 3
      kernel_size: 3
      hidden_dim: 256
    breathiness:
      enabled: true   # enable for fine-tuning
      n_layers: 3
      kernel_size: 3
      hidden_dim: 256
    voicing:
      enabled: true
      n_layers: 2
      kernel_size: 3
      hidden_dim: 256

  duration_predictor:
    enabled: false

audio:
  sample_rate: 16000
  hop_length: 160
  win_length: 400
  n_fft: 512
  target_sr: 44100

hubert:
  layer: 12
  feature_dim: 768

f0:
  method: "rmvpe"
  f0_min: 50.0
  f0_max: 1100.0

rvc_compensation:
  enabled: true
  alpha: 0.35
  rvc_model: null  # set to RVC .pth path for compensation, e.g.:
  # rvc_model: "RVC/RVC20240604Nvidia/assets/weights/Iroha_e175_s6300.pth"
  rvc_index: null
  cache_dir: "data/processed/rvc_compensation"

data:
  processed_dir: "data/processed/ja_merged"
  val_ratio: 0.05
  test_ratio: 0.05
  max_frames: 1200
  min_frames: 30
  augmentation:
    pitch_shift:
      enabled: true
      range_semitones: [-8, 8]  # narrower range for fine-tuning
      prob: 0.5
    time_stretch:
      enabled: true
      range: [0.93, 1.07]      # narrower range
      prob: 0.25
    noise:
      enabled: false

training:
  optimizer:
    type: "adamw"
    lr: 5.0e-5           # lower LR for fine-tuning
    betas: [0.9, 0.98]
    weight_decay: 0.01
    eps: 1.0e-8
  scheduler:
    type: "warmup_cosine"
    warmup_steps: 1000    # shorter warmup
    min_lr: 1.0e-6
    total_steps: 50000
  batch_size: 16
  accumulate_grad: 1
  num_workers: 4
  max_steps: 50000
  val_every: 1000         # more frequent validation (smaller dataset)
  save_every: 2500
  log_every: 50
  loss:
    flow_matching: 1.0
    f0: 1.0
    duration: 0.0
    energy: 0.1
    breathiness: 0.1
    voicing: 0.05
    multiscale_hubert:
      enabled: true
      scales: [1, 5, 10]
      weight: 0.3
  grad_clip: 1.0
  ema:
    enabled: true
    decay: 0.9999
  fp16: true
  save_top_k: 5
  monitor: "val/total_loss"

inference:
  flow_steps: 10
  solver: "midpoint"
  cfg_scale: 2.5
  temperature: 1.0

paths:
  project_root: "."
  rvc_root: "RVC/RVC20240604Nvidia"
  hubert_model: "RVC/RVC20240604Nvidia/assets/hubert/hubert_base.pt"
  rmvpe_model: "RVC/RVC20240604Nvidia/assets/rmvpe/rmvpe.pt"
  rvc_weights_dir: "RVC/RVC20240604Nvidia/assets/weights"
  checkpoint_dir: "checkpoints/finetune_ja"
  log_dir: "logs/finetune_ja"
