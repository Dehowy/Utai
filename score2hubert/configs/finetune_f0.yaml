# Score2HuBERT — Phase 6: Targeted F0 fine-tuning
#
# Only trains f0_predictor (6.6M params). Everything else frozen.
# ACE-Opencpop (83% of data) has clean machine-synthesized F0 targets;
# GTSinger (17%) has noisier human F0. The model will mostly learn from clean data.
#
# Launch:
#   venv/Scripts/python.exe scripts/train.py \
#     --config configs/finetune_f0.yaml \
#     --init-from checkpoints/finetune_discrete/best.pt

model:
  mode: deterministic    # det_head frozen, just for monitoring metrics

  encoder:
    d_model: 512
    n_layers: 4
    n_heads: 8
    d_ff: 2048
    conv_kernel_size: 31
    dropout: 0.1
    phoneme_vocab_size: 80
    max_pitch: 128
    pitch_embed_dim: 256
    use_relative_pos: true
    n_techniques: 6

  flow_matching:
    d_hubert: 768
    n_layers: 4
    n_heads: 8
    d_ff: 2048
    d_cond: 512
    dropout: 0.1
    sigma_min: 1.0e-4
    ot_ode: true
    cfg:
      enabled: false
      drop_prob: 0.0
      guidance_scale: 1.0

  det_head:
    d_hidden: 512
    n_blocks: 4
    kernel_size: 7
    dropout: 0.1

  f0_predictor:
    hidden_dim: 384
    conv_layers: 5
    conv_kernel: 5
    lstm_layers: 2
    dropout: 0.1

  variance:
    energy:
      enabled: true
      n_layers: 3
      kernel_size: 3
      hidden_dim: 256
    breathiness:
      enabled: true
      n_layers: 3
      kernel_size: 3
      hidden_dim: 256
    voicing:
      enabled: true
      n_layers: 2
      kernel_size: 3
      hidden_dim: 256

  duration_predictor:
    enabled: false

audio:
  sample_rate: 16000
  hop_length: 160
  win_length: 400
  n_fft: 512
  target_sr: 44100

hubert:
  layer: 12
  feature_dim: 768

f0:
  method: "rmvpe"
  f0_min: 50.0
  f0_max: 1100.0

rvc_compensation:
  enabled: false

data:
  processed_dir: "data/processed/multi_lang_4"
  val_ratio: 0.05
  test_ratio: 0.05
  max_frames: 1200
  min_frames: 30
  augmentation:
    pitch_shift:
      enabled: true
      range_semitones: [-8, 8]
      prob: 0.5
    time_stretch:
      enabled: true
      range: [0.93, 1.07]
      prob: 0.25
    noise:
      enabled: false

training:
  unfreeze_only: ["f0_predictor"]   # ONLY train f0_predictor, freeze everything else
  optimizer:
    type: "adamw"
    lr: 3.0e-4                      # Higher lr — f0_predictor is small (6.6M) and well-init'd
    betas: [0.9, 0.98]
    weight_decay: 0.01
    eps: 1.0e-8
  scheduler:
    type: "warmup_cosine"
    warmup_steps: 300
    min_lr: 1.0e-6
    total_steps: 8000
  batch_size: 48
  accumulate_grad: 1
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
  max_steps: 8000
  val_every: 500
  save_every: 2000
  log_every: 50
  loss:
    det: 1.0                        # det loss computed for monitoring (but det_head frozen → no grad)
    flow_matching: 0.0
    f0: 3.0                         # HIGH weight — f0 is the only real training signal
    duration: 0.0
    energy: 0.0
    breathiness: 0.0
    voicing: 0.0
    reconstruction: 0.0
    multiscale_hubert:
      enabled: false
      scales: [1, 5, 10]
      weight: 0.3
  grad_clip: 1.0
  ema:
    enabled: false
    decay: 0.9999
  fp16: true
  save_top_k: 3
  monitor: "val/recon_l1"

inference:
  flow_steps: 1
  solver: "euler"
  cfg_scale: 1.0
  temperature: 1.0

paths:
  project_root: "."
  rvc_root: "RVC/RVC20240604Nvidia"
  hubert_model: "RVC/RVC20240604Nvidia/assets/hubert/hubert_base.pt"
  rmvpe_model: "RVC/RVC20240604Nvidia/assets/rmvpe/rmvpe.pt"
  rvc_weights_dir: "RVC/RVC20240604Nvidia/assets/weights"
  checkpoint_dir: "checkpoints/finetune_f0"
  log_dir: "logs/finetune_f0"
