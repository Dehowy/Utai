# Score2HuBERT — Phase 1 (Plan C): Deterministic head pre-training
#
# Switches from flow matching to direct regression: det_head([frame_hidden | f0_emb])
# -> HuBERT features, trained with L1 + 0.5*(1-cos).
#
# Why: HuBERT space is ~80% deterministic given the score (verified empirically,
# cross-singer same-segment cos sim 0.80). Flow matching's stochastic sampling
# fights this — Plan A reached cos 0.76 but produced "啊啊啊" audio because the
# flow decoder learned to match the marginal distribution while ignoring phoneme
# content. The frozen-encoder diagnostic head reached cos 0.51 in 100 steps and
# produced audio with identifiable lyrics — confirming the regression target is
# well-defined and the encoder representation is sufficient.
#
# Initialized from Plan A's best.pt: encoder / variance_adaptor / f0_predictor /
# f0_cond_proj all warm-start from Plan A. det_head starts fresh. flow_decoder
# is frozen and excluded from optimizer (kept in checkpoint for future hybrid).

model:
  mode: deterministic       # Plan C — bypass flow_decoder, use det_head

  encoder:
    d_model: 512
    n_layers: 4
    n_heads: 8
    d_ff: 2048
    conv_kernel_size: 31
    dropout: 0.1
    phoneme_vocab_size: 80
    max_pitch: 128
    pitch_embed_dim: 256
    use_relative_pos: true

  flow_matching:
    # Kept for state_dict compatibility — the module is built and frozen,
    # not used in training or inference under deterministic mode.
    d_hubert: 768
    n_layers: 4
    n_heads: 8
    d_ff: 2048
    d_cond: 512
    dropout: 0.1
    sigma_min: 1.0e-4
    ot_ode: true
    cfg:
      enabled: false
      drop_prob: 0.0
      guidance_scale: 1.0

  det_head:
    d_hidden: 512           # smaller than HuBERT dim — keeps head light, costs one proj
    n_blocks: 4             # 4 residual conv blocks — RF ~28 frames ≈ 560ms (syllable level)
    kernel_size: 7          # local context only — encoder above handles global via Conformer
    dropout: 0.1
    # Approx params: in_proj 0.52M + 4*conv 7.34M + out_proj 0.39M ≈ 8.3M
    # Sized as ~1.6x the diagnostic head (4.86M, frozen-encoder, proven to produce
    # audible lyrics in 100 steps). End-to-end finetune doesn't need a bigger head.

  f0_predictor:
    hidden_dim: 384
    conv_layers: 5
    conv_kernel: 5
    lstm_layers: 2
    dropout: 0.1

  variance:
    energy:
      enabled: true
      n_layers: 3
      kernel_size: 3
      hidden_dim: 256
    breathiness:
      enabled: false
    voicing:
      enabled: true
      n_layers: 2
      kernel_size: 3
      hidden_dim: 256

  duration_predictor:
    enabled: false

audio:
  sample_rate: 16000
  hop_length: 160
  win_length: 400
  n_fft: 512
  target_sr: 44100

hubert:
  layer: 12
  feature_dim: 768

f0:
  method: "rmvpe"
  f0_min: 50.0
  f0_max: 1100.0

rvc_compensation:
  enabled: false

data:
  processed_dir: "data/processed/ace_opencpop"
  val_ratio: 0.05
  test_ratio: 0.05
  max_frames: 1200
  min_frames: 30
  augmentation:
    pitch_shift:
      enabled: true
      range_semitones: [-12, 12]
      prob: 0.5
    time_stretch:
      enabled: true
      range: [0.9, 1.1]
      prob: 0.3
    noise:
      enabled: false

training:
  optimizer:
    type: "adamw"
    lr: 1.5e-4              # Match Plan A — warm encoder needs gentle nudging.
                            # Adam adapts per-param so the fresh det_head still learns fast.
    betas: [0.9, 0.98]
    weight_decay: 0.01
    eps: 1.0e-8
  scheduler:
    type: "warmup_cosine"
    warmup_steps: 1000      # short warmup — encoder is pretrained
    min_lr: 1.0e-6
    total_steps: 30000      # warm-start from Plan A best.pt: 70M params already trained,
                            # only 8M det_head is fresh. Plan A's encoder converged in ~17k
                            # steps from a similar warm-start. det_head's loss signal is much
                            # cleaner than flow's, so it should learn even faster.
  batch_size: 32
  accumulate_grad: 1
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 4
  max_steps: 30000
  val_every: 1000
  save_every: 2500
  log_every: 50
  loss:
    det: 1.0                # NEW: deterministic head L1 + 0.5*(1-cos)
    flow_matching: 0.0      # disabled — flow_decoder is frozen
    f0: 1.0
    duration: 0.0
    energy: 0.1
    breathiness: 0.0
    voicing: 0.05
    reconstruction: 0.0     # disabled — det_head replaces it
    multiscale_hubert:
      enabled: false
      scales: [1, 5, 10]
      weight: 0.3
  grad_clip: 1.0
  ema:
    enabled: false   # DISABLED for det mode warm-start. EMA decay 0.9999 was producing
                     # a "weight space interpolation" pathology in early training:
                     # the shadow blended Plan A's encoder (warm-start) with the rapidly-
                     # adapting live encoder, and the network's nonlinearity made the
                     # blend point a dysfunctional model (val f0_mae 85 vs live 54 cents,
                     # val cos 0.22 vs live 0.82 at step 5000). Live model is healthy;
                     # disable EMA to make val/best/inference all use the live model.
                     # See diag_live_vs_ema.py for the smoking-gun comparison.
    decay: 0.9999
  fp16: true
  save_top_k: 3
  monitor: "val/recon_l1"   # det_l1 is logged under this name (see score2hubert.py)

inference:
  flow_steps: 1             # not used in det mode — single forward pass
  solver: "euler"
  cfg_scale: 1.0            # CFG disabled in det mode
  temperature: 1.0

paths:
  project_root: "."
  rvc_root: "RVC/RVC20240604Nvidia"
  hubert_model: "RVC/RVC20240604Nvidia/assets/hubert/hubert_base.pt"
  rmvpe_model: "RVC/RVC20240604Nvidia/assets/rmvpe/rmvpe.pt"
  rvc_weights_dir: "RVC/RVC20240604Nvidia/assets/weights"
  checkpoint_dir: "checkpoints/pretrain_opencpop_det"   # NEW dir, don't clobber Plan A
  log_dir: "logs/pretrain_opencpop_det"
