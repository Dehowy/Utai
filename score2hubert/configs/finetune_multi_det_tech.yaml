# Score2HuBERT — Phase 3: Technique Embedding Fine-tuning (deterministic mode)
#
# Goal: fix the "fuzzy articulation" observed on GTSinger singing samples by
# giving the encoder explicit per-phoneme technique flags (GTSinger's 6
# singing techniques: mix_voice, falsetto, breathy, pharyngeal, vibrato,
# glissando). The det_head averaging is the same — we're reducing the hidden
# variance the model has to average over by conditioning on the technique that
# caused the variance. This is the approach GTSinger's paper was designed for
# ("technique-controllable SVS").
#
# Init from Phase 2 fix best.pt (finetune_multi_det_fix/best.pt). The new
# encoder.tech_proj weights are zero-initialized, so step-0 behavior is
# identical to Phase 2 fix — strict-false load leaves all old weights intact.
# As training proceeds, tech_proj learns to map the 6 binary flags into
# d_model-dim embeddings that disambiguate per-technique phoneme realizations.
#
# Phase 2 fix final metrics (starting point):
#   val_recon_l1 = 0.1259, val_recon_cos = 0.826, val_f0_mae = 61.8 cents
#
# Expected Phase 3 improvements on GTSinger singing samples:
#   - recon_l1/cos: small improvement as fuzzy articulation clarifies
#   - f0_mae: likely stable (f0 doesn't depend on tech)
#   - ACE-Opencpop samples: unchanged (all tech flags = 0 → zero-init proj → no signal)
#   - NEW: user can control technique per-phoneme at inference time
#
# Launch:
#   venv/Scripts/python.exe scripts/train.py \
#     --config configs/finetune_multi_det_tech.yaml \
#     --init-from checkpoints/finetune_multi_det_fix/best.pt

model:
  mode: deterministic

  encoder:
    d_model: 512
    n_layers: 4
    n_heads: 8
    d_ff: 2048
    conv_kernel_size: 31
    dropout: 0.1
    phoneme_vocab_size: 80
    max_pitch: 128
    pitch_embed_dim: 256
    use_relative_pos: true
    n_techniques: 6            # Phase 3: 6 GTSinger technique flags per phoneme

  flow_matching:
    d_hubert: 768
    n_layers: 4
    n_heads: 8
    d_ff: 2048
    d_cond: 512
    dropout: 0.1
    sigma_min: 1.0e-4
    ot_ode: true
    cfg:
      enabled: false
      drop_prob: 0.0
      guidance_scale: 1.0

  det_head:
    d_hidden: 512
    n_blocks: 4
    kernel_size: 7
    dropout: 0.1

  f0_predictor:
    hidden_dim: 384
    conv_layers: 5
    conv_kernel: 5
    lstm_layers: 2
    dropout: 0.1

  variance:
    energy:
      enabled: true
      n_layers: 3
      kernel_size: 3
      hidden_dim: 256
    breathiness:
      enabled: true
      n_layers: 3
      kernel_size: 3
      hidden_dim: 256
    voicing:
      enabled: true
      n_layers: 2
      kernel_size: 3
      hidden_dim: 256

  duration_predictor:
    enabled: false

audio:
  sample_rate: 16000
  hop_length: 160
  win_length: 400
  n_fft: 512
  target_sr: 44100

hubert:
  layer: 12
  feature_dim: 768

f0:
  method: "rmvpe"
  f0_min: 50.0
  f0_max: 1100.0

rvc_compensation:
  enabled: false

data:
  processed_dir: "data/processed/multi_lang_4"
  val_ratio: 0.05
  test_ratio: 0.05
  max_frames: 1200
  min_frames: 30
  augmentation:
    pitch_shift:
      enabled: true
      range_semitones: [-8, 8]
      prob: 0.5
    time_stretch:
      enabled: true
      range: [0.93, 1.07]
      prob: 0.25
    noise:
      enabled: false

training:
  optimizer:
    type: "adamw"
    lr: 5.0e-5                # Slightly lower than Phase 2 fix 7e-5 — model is well-trained
    betas: [0.9, 0.98]
    weight_decay: 0.01
    eps: 1.0e-8
  scheduler:
    type: "warmup_cosine"
    warmup_steps: 300
    min_lr: 1.0e-6
    total_steps: 8000         # Enough to see gtsinger data multiple times for tech learning
  batch_size: 48              # BUMPED from Phase 2's 32 based on profile: peak 7.46 GB, no spillover, 130 sps (1.1x faster than 32)
  accumulate_grad: 1
  num_workers: 8              # BUMPED from 4. Data-loading isn't the bottleneck but no reason to leave headroom
  persistent_workers: true
  prefetch_factor: 4
  max_steps: 8000
  val_every: 250
  save_every: 1000
  log_every: 50
  loss:
    det: 1.0
    flow_matching: 0.0
    f0: 1.0
    duration: 0.0
    energy: 0.1
    breathiness: 0.05
    voicing: 0.05
    reconstruction: 0.0
    multiscale_hubert:
      enabled: false
      scales: [1, 5, 10]
      weight: 0.3
  grad_clip: 1.0
  ema:
    enabled: false
    decay: 0.9999
  fp16: true
  save_top_k: 3
  monitor: "val/recon_l1"

inference:
  flow_steps: 1
  solver: "euler"
  cfg_scale: 1.0
  temperature: 1.0

paths:
  project_root: "."
  rvc_root: "RVC/RVC20240604Nvidia"
  hubert_model: "RVC/RVC20240604Nvidia/assets/hubert/hubert_base.pt"
  rmvpe_model: "RVC/RVC20240604Nvidia/assets/rmvpe/rmvpe.pt"
  rvc_weights_dir: "RVC/RVC20240604Nvidia/assets/weights"
  checkpoint_dir: "checkpoints/finetune_multi_det_tech"
  log_dir: "logs/finetune_multi_det_tech"
